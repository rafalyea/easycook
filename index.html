<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyCook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">EasyCook</span>
    <a href="index.html" class="active" aria-current="page">Recipe Explorer</a>
    <a href="mealplan.html">My Meal Plan</a>
  </nav>

  <main class="page">
    <header class="banner">
      <h1>EasyCook</h1>
      <p>Find a recipe, plan your week.</p>
    </header>

    <div class="teaser" aria-hidden="true">
      <div class="teaser-track">
        <img src="images/teaser1.jpg" alt="">
        <img src="images/teaser2.jpg" alt="">
        <img src="images/teaser3.jpg" alt="">
        <img src="images/teaser4.jpg" alt="">
        <img src="images/teaser5.jpg" alt="">
        
        <img src="images/teaser1.jpg" alt="">
        <img src="images/teaser2.jpg" alt="">
        <img src="images/teaser3.jpg" alt="">
        <img src="images/teaser4.jpg" alt="">
        <img src="images/teaser5.jpg" alt="">
      </div>
    </div>

    <section class="panel" id="finder" aria-labelledby="finder-title">
      <h2 id="finder-title">What are you cooking?</h2>

      <div class="form-grid">
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- Select a category --</option>
          </select>
        </div>

        <div>
          <label for="ingredient">Ingredient you have (optional)</label>
          <input type="text" id="ingredient" placeholder="e.g. chicken">
        </div>

        <div>
          <label for="effort">Cooking effort</label>
          <select id="effort">
            <option value="any">Any</option>
            <option value="quick">Quick (8 ingredients or fewer)</option>
            <option value="normal">Normal (9-14 ingredients)</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="suggest-btn">Suggest a recipe</button>
      </div>

      <div id="suggestion" aria-live="polite"></div>
    </section>

    <p id="status" aria-live="polite"></p>
    <div id="meal-list"></div>
    <div id="meal-details"></div>
  </main>

  <!-- Appears only after a recipe is opened (see .back-top in style.css) -->
  <a href="#finder" class="back-top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    Back to recipes
  </a>

  <footer>Recipe data from TheMealDB</footer>

  <script src="js/api.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/calculate.js"></script>
</body>
</html>
